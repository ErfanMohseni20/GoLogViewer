<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="{{.PathPrefix}}/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📋</text></svg>">
    <script>
        // Applied before first paint so a dark-theme user never sees a light flash.
        try {
            const saved = localStorage.getItem('gologviewer-theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
        } catch (e) { /* private mode */ }
    </script>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">G</span>
            <div>
                <h1>{{.Title}}</h1>
                <p>Log viewer</p>
            </div>
        </div>

        <div class="sidebar-head">
            <h2>Log files</h2>
        </div>

        <ul id="file-list" class="file-list">
            <li class="empty">Loading…</li>
        </ul>

        <div class="sidebar-foot">
            {{if .CanDownload}}
            <button id="download-btn" type="button" class="btn" disabled>Download</button>
            {{end}}
            {{if not .ReadOnly}}
            <button id="delete-btn" type="button" class="btn btn-danger" disabled>Delete</button>
            <button id="clear-all-btn" type="button" class="btn btn-danger">Delete all</button>
            {{end}}
        </div>
    </aside>

    <main class="content">
        <header class="toolbar">
            <div class="toolbar-title">
                <h2 id="current-file">Select a log file</h2>
                <span id="summary"></span>
            </div>

            <div class="search-wrap">
                <input id="search" type="search" placeholder="Search…  (press /)"
                       autocomplete="off" spellcheck="false" aria-label="Search log entries">
            </div>

            <select id="per-page" aria-label="Entries per page">
                <option value="25">25</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="200">200</option>
            </select>

            <button id="live-btn" type="button" class="btn" aria-pressed="false" disabled>Live tail</button>
            <button id="refresh-btn" type="button" class="btn">Refresh</button>
            <button id="theme-btn" type="button" class="btn btn-icon" aria-label="Toggle theme">◐</button>
        </header>

        <div id="levels" class="levels" role="group" aria-label="Filter by level">
            {{range .Levels}}
            <button type="button" class="chip chip-{{.}}" data-level="{{.}}" aria-pressed="false">
                <span class="dot" aria-hidden="true"></span>
                <span>{{.}}</span>
                <span class="count">0</span>
            </button>
            {{end}}
        </div>

        <section id="logs" class="logs" aria-live="polite">
            <div class="state"><strong>Select a log file</strong><span>Pick a file from the sidebar to begin.</span></div>
        </section>

        <footer class="pagination">
            <button id="prev-page" type="button" class="btn" disabled>← Previous</button>
            <span id="page-info">Page 1</span>
            <button id="next-page" type="button" class="btn" disabled>Next →</button>
            <span style="color: var(--muted); margin-left: 12px;">
                <kbd>/</kbd> search · <kbd>j</kbd>/<kbd>k</kbd> pages · <kbd>l</kbd> live · <kbd>r</kbd> refresh
            </span>
        </footer>
    </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="config">
{{.Config}}
</script>
<script src="{{.PathPrefix}}/static/app.js" defer></script>
</body>
</html>
