<!DOCTYPE html>
<html>
<head>
    <title>GolaveLog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white p-10">

    <h1 class="text-4xl font-bold mb-10">
        GolaveLog Viewer
    </h1>

    <div id="logs" class="space-y-4"></div>

    <script>
        async function loadLogs() {
            try {
                const response = await fetch('/logs/api')
                
                if (!response.ok) {
                    throw new Error('Failed to fetch logs')
                }
                
                const logs = await response.json()
                const container = document.getElementById('logs')
                container.innerHTML = ''

                logs.reverse().forEach(log => {
                    const div = document.createElement('div')
                    let color = 'bg-blue-500'

                    if (log.status === 'ERROR') {
                        color = 'bg-red-500'
                    } else if (log.status === 'WARNING') {
                        color = 'bg-yellow-500'
                    }

                    div.className = 'bg-gray-900 rounded-xl p-5 border border-gray-800'
                    
                    // Escape HTML to prevent XSS
                    const escapeHtml = (text) => {
                        if (!text) return ''
                        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }
                        return text.replace(/[&<>"']/g, m => map[m])
                    }

                    let errorHtml = ''
                    if (log.error) {
                        errorHtml = `<div class="text-red-400 text-sm mb-2">${escapeHtml(log.error)}</div>`
                    }

                    div.innerHTML = `
                        <div class="flex items-center gap-3 mb-3">
                            <span class="${color} px-3 py-1 rounded-lg text-sm font-bold">
                                ${escapeHtml(log.status)}
                            </span>
                        </div>
                        <div class="text-lg mb-2">
                            ${escapeHtml(log.message)}
                        </div>
                        ${errorHtml}
                        <div class="text-gray-500 text-xs">
                            ${escapeHtml(log.time)}
                        </div>
                    `
                    container.appendChild(div)
                })
            } catch (err) {
                console.error('Error loading logs:', err)
                document.getElementById('logs').innerHTML = 
                    '<div class="text-red-400">خطا در دریافت لاگ‌ها</div>'
            }
        }

        loadLogs()
    </script>
</body>
</html>
